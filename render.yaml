services:
  - type: web
    name: wardlens-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: https://wardlens.vercel.app
      - key: DEMO_LOGINS_ENABLED
        value: false
      - key: DEMO_RESIDENT_EMAIL
        value: resident@wardlens.com
      - key: DEMO_RESIDENT_PASSWORD
        sync: false
      - key: DEMO_OFFICER_EMAIL
        value: officer@wardlens.com
      - key: DEMO_OFFICER_PASSWORD
        sync: false
      - key: DEMO_OVERSIGHT_EMAIL
        value: oversight@wardlens.com
      - key: DEMO_OVERSIGHT_PASSWORD
        sync: false
